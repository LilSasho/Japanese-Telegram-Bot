version: '3.8'

services:
  # Japanese Learning Telegram Bot
  bot:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: japanese-learning-bot
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      # Persist database
      - bot-data:/app/data
      # Mount logs for debugging
      - ./logs:/app/logs
    networks:
      - bot-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import app; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: bot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL database (optional - for production)
  # Uncomment if using PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: bot-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: japanese_bot
  #     POSTGRES_USER: botuser
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - bot-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U botuser"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

volumes:
  bot-data:
    driver: local
  redis-data:
    driver: local
  # postgres-data:
  #   driver: local

networks:
  bot-network:
    driver: bridge
