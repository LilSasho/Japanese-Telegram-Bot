name: Test Japanese Learning Bot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Bot
    runs-on: ubuntu-latest
    
    steps:
    # Get the code
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Set up Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    # Install what we need
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot pytest
        pip install -r requirements.txt
    
    # Check code quality
    - name: Check code style
      run: |
        pip install black flake8
        black --check .
        flake8 . --max-line-length=88 --ignore=E203,W503
    
    # Run tests
    - name: Run tests
        # For now, just check if main.py imports correctly
        # Later you'll add: pytest tests/
      run: |
        python -c "import main; print('✅ main.py imported successfully')"
        
      env:
        # Don't use a real bot token in tests
        BOT_TOKEN: "fake_token_for_testing"
